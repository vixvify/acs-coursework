<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | Secure OTP Demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/app.js"></script>
  </head>
  <body data-page="login">
    <main class="layout">
      <section class="intro" aria-label="ขั้นตอนการเข้าสู่ระบบ">
        <div class="step-count">STEP 01 / 03</div>
        <h1>เข้าสู่ระบบ</h1>
        <p>
          ยืนยันตัวตนด้วย Username และ Password แล้วรับรหัส OTP ทางอีเมล
          ก่อนเข้าสู่หน้า Profile
        </p>
        <div class="steps">
          <span class="active">01 · Login</span><span>02 · OTP</span
          ><span>03 · Profile</span>
        </div>
      </section>
      <section class="panel" aria-labelledby="form-title">
        <div class="eyebrow">WELCOME BACK</div>
        <h2 id="form-title">Login</h2>
        <p class="muted">กรอกข้อมูลเพื่อเข้าสู่ระบบ</p>
        <div class="status" data-status role="alert" hidden></div>
        <form id="login-form" novalidate>
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            autocomplete="username"
            placeholder="student"
            required
          />
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            placeholder="รหัสผ่าน"
            required
          />
          <button type="submit" class="primary">
            ดำเนินการต่อ <span aria-hidden="true">→</span>
          </button>
        </form>
      </section>
    </main>
  </body>
</html>
